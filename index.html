<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Севстар - Главный экран</title>
    <style>
        /* Фирменная палитра Севстар */
        :root {
            --brand-purple: rgb(100, 45, 144);
            --brand-yellow: rgb(236, 177, 68);
            --brand-black: rgb(53, 51, 51);
            --brand-white: rgb(255, 255, 255);
            
            --bg-color: #f0f0f3;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            
            --status-green: #4caf50;
            --status-red: #f44336;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e0e0e0;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent; /* Убирает синее выделение при клике на iOS */
        }

        .control-panel {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--brand-black); color: var(--brand-white);
            padding: 10px; display: flex; justify-content: center; gap: 20px; z-index: 1000;
        }

        .control-panel select {
            padding: 5px 10px; border-radius: 5px; border: none;
            background: var(--brand-white); color: var(--brand-black);
        }

        .app-container {
            width: 100%; max-width: 400px; min-height: 850px;
            background-color: var(--bg-color); margin-top: 50px;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow-x: hidden; display: flex; flex-direction: column;
            padding-bottom: 50px;
        }

        /* Неоморфизм */
        .neumorphic {
            background: var(--bg-color);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border-radius: 20px; transition: transform 0.1s ease;
        }
        .neumorphic-inset {
            background: var(--bg-color);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border-radius: 20px;
        }

        /* Хедер */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 35px; object-fit: contain; }
        .avatar {
            width: 40px; height: 40px; border-radius: 50%; background: #ccc;
            box-shadow: 0 0 10px var(--status-green); transition: box-shadow 0.3s ease;
        }

        /* Истории */
        .stories-container { display: flex; overflow-x: auto; padding: 10px 20px; gap: 15px; scrollbar-width: none; }
        .stories-container::-webkit-scrollbar { display: none; }
        .story { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .story-circle {
            width: 60px; height: 60px; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; color: var(--brand-purple); font-size: 24px;
        }
        .story span { font-size: 11px; color: var(--brand-black); font-weight: 500;}

        /* Баланс */
        .main-card { margin: 20px; padding: 25px; transition: box-shadow 0.3s ease; position: relative; }
        .main-card.glow-green { box-shadow: 0 0 20px rgba(76, 175, 80, 0.3), 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); }
        .main-card.glow-red { box-shadow: 0 0 20px rgba(244, 67, 54, 0.3), 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); }
        
        .balance-title { font-size: 14px; color: var(--brand-black); opacity: 0.7; margin: 0 0 5px 0;}
        .balance-amount { font-size: 36px; font-weight: bold; color: var(--brand-purple); margin: 0 0 5px 0;}
        .status-text { font-size: 14px; color: var(--status-green); font-weight: 500; display: flex; align-items: center; gap: 5px; transition: color 0.3s ease;}
