<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Севстар</title>

<style>

/* ===== ОСНОВА ===== */

:root {
    --brand: #642d90;
    --bg: #f0f0f3;
    --text: #353333;
    --shadow-light: #ffffff;
    --shadow-dark: #d1d9e6;
}

body {
    margin:0;
    font-family:-apple-system, sans-serif;
    background:var(--bg);
}

/* ===== NEUMORPHISM ===== */

.neo {
    background: var(--bg);
    box-shadow: 6px 6px 12px var(--shadow-dark),
                -6px -6px 12px var(--shadow-light);
    border-radius:20px;
}

/* ===== ИКОНКИ ===== */

.icon {
    width:22px;
    height:22px;
    stroke:var(--brand);
    stroke-width:2;
    fill:none;
}

/* ===== КАРТОЧКИ АККАУНТА ===== */

.slider-wrap {
    margin:20px;
    overflow:visible;
    position:relative;
}

.slider-wrap::after {
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:40px;
    background:linear-gradient(to bottom, transparent, var(--bg));
}

.slider {
    display:flex;
    transition:.5s cubic-bezier(.2,.8,.2,1);
}

.card {
    min-width:100%;
    padding:25px;
}

.balance {
    font-size:32px;
    color:var(--brand);
}

/* ===== КНОПКИ ===== */

.btn {
    padding:14px;
    border:none;
    border-radius:14px;
    background:var(--brand);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

.btn:active {
    transform:scale(.95);
}

/* ===== СЕРВИСЫ ===== */

.grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    padding:20px;
}

.card-mini {
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;
    transition:.2s;
}

.card-mini:hover {
    transform:translateY(-3px);
}

.logo {
    width:36px;
    height:36px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(100,45,144,0.1);
}

/* ===== ТАРИФЫ ===== */

.tariff {
    margin:20px;
    padding:20px;
}

.price {
    font-size:22px;
    font-weight:bold;
}

.hidden {
    display:none;
}

/* ===== АНИМАЦИИ (ЯНДЕКС GO STYLE) ===== */

.tap {
    transition:transform .15s cubic-bezier(.2,.8,.2,1);
}

.tap:active {
    transform:scale(.96);
}

</style>
</head>

<body>

<!-- ===== АККАУНТ ===== -->

<div class="slider-wrap">
    <div class="slider" id="slider">

        <div class="card neo">
            <div>Баланс</div>
            <div class="balance">1 250 ₽</div>

            <button class="btn tap">Пополнить</button>
        </div>

        <div class="card neo">
            <div>Баланс</div>
            <div class="balance">320 ₽</div>

            <button class="btn tap">Пополнить</button>
        </div>

    </div>
</div>

<!-- ===== СЕРВИСЫ ===== -->

<div class="grid">

    <div class="card-mini neo tap">
        <div class="logo">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="3" y="3" width="18" height="18" rx="4"/>
                <polygon points="10 8 16 12 10 16"/>
            </svg>
        </div>
        <div>Кинотеатр</div>
        <div>169 ₽/мес</div>
    </div>

    <div class="card-mini neo tap">
        <div class="logo">
            <svg class="icon" viewBox="0 0 24 24">
                <rect x="2" y="7" width="20" height="15" rx="2"/>
            </svg>
        </div>
        <div>ТВ</div>
        <div>149 ₽/мес</div>
    </div>

</div>

<!-- ===== ТАРИФЫ ===== -->

<div class="tariff neo">

    <div>🔥 Премиум</div>
    <div class="price">1 740 ₽</div>

    <button class="btn tap">Подключить</button>

</div>

<button class="btn tap" style="margin:20px;width:calc(100% - 40px);" onclick="toggleTariffs()">
    Показать ещё
</button>

<div id="moreTariffs" class="hidden">

    <div class="tariff neo">
        <div>Обычный тариф</div>
        <div class="price">1 180 ₽</div>
    </div>

</div>

<script>

/* ===== СЛАЙДЕР (плавный как iOS) ===== */

let index = 0;
const slider = document.getElementById('slider');

document.body.addEventListener('click', () => {
    index = (index + 1) % 2;
    slider.style.transform = `translateX(-${index*100}%)`;
});

/* ===== ТАРИФЫ ===== */

function toggleTariffs() {
    const el = document.getElementById('moreTariffs');
    el.classList.toggle('hidden');
}

</script>

</body>
</html>
