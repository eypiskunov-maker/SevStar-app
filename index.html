<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Севстар - Главный экран</title>
    <style>
        :root {
            --brand-purple: rgb(100, 45, 144);
            --brand-yellow: rgb(236, 177, 68);
            --brand-black: rgb(53, 51, 51);
            --brand-white: rgb(255, 255, 255);
            --bg-color: #f0f0f3;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            --status-green: #4caf50;
            --status-red: #f44336;
        }

        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #e0e0e0;
            display: flex; justify-content: center; align-items: flex-start;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Контейнер приложения */
        .app-container {
            width: 100%; max-width: 400px; min-height: 850px;
            background-color: var(--bg-color); margin-top: 10px;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1);
            overflow-x: hidden; display: flex; flex-direction: column;
            padding-bottom: 50px;
        }

        /* Неоморфизм */
        .neumorphic {
            background: var(--bg-color);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            border-radius: 20px; transition: transform 0.1s ease;
        }
        .neumorphic-inset {
            background: var(--bg-color);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            border-radius: 20px;
        }

        /* Хедер */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 35px; object-fit: contain; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; box-shadow: 0 0 10px var(--status-green); }

        /* Баланс */
        .main-card { margin: 20px; padding: 25px; position: relative; }
        .main-card.glow-green { box-shadow: 0 0 20px rgba(76, 175, 80, 0.3), 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); }
        .balance-title { font-size: 14px; color: var(--brand-black); opacity: 0.7; margin: 0 0 5px 0;}
        .balance-amount { font-size: 36px; font-weight: bold; color: var(--brand-purple); margin: 0 0 5px 0;}
        .status-text { font-size: 14px; color: var(--status-green); font-weight: 500; display: flex; align-items: center; gap: 5px;}
        .status-text::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
        .balance-subtext { font-size: 12px; color: var(--brand-black); opacity: 0.6; margin-top: 4px; padding-left: 13px; }

        .card-buttons { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .secondary-buttons { display: flex; gap: 15px; }
        .btn { flex: 1; padding: 15px 0; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; }
        .btn-primary { background: var(--brand-purple); color: var(--brand-white); width: 100%; box-shadow: 4px 4px 10px rgba(100, 45, 144, 0.3);}
        .btn-primary:active { transform: scale(0.97); }
        .btn-secondary { color: var(--brand-purple); font-size: 13px; }
        .btn-secondary:active { transform: scale(0.97); }

        /* Умный дом */
        .section-title { margin: 10px 20px; font-size: 18px; font-weight: bold; color: var(--brand-black); }
        .smart-home-container { display: flex; overflow-x: auto; padding: 10px 20px 20px 20px; gap: 15px; scrollbar-width: none; }
        .smart-home-container::-webkit-scrollbar { display: none; }
        .sh-card { min-width: 160px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .sh-camera { height: 90px; background-color: #333; border-radius: 10px; position: relative; background-size: cover; background-position: center; }
        .sh-camera::after { content: 'LIVE'; position: absolute; top: 5px; left: 5px; background: red; color: white; font-size: 8px; padding: 2px 4px; border-radius: 3px;}
        .sh-title { font-size: 14px; font-weight: bold; color: var(--brand-black); margin-bottom: 2px;}
        .sh-subtitle { font-size: 11px; font-weight: 300; color: var(--brand-black); opacity: 0.7; }
        .btn-open { padding: 12px 0; border: none; color: var(--brand-purple); font-weight: bold; width: 100%; cursor: pointer; transition: all 0.2s; }
        .btn-open:active { transform: scale(0.95); }

        /* Окно Оплаты (Надежная верстка) */
        .payment-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); z-index: 2000; opacity: 0; transition: opacity 0.3s ease;
        }
        .payment-overlay.active { display: block; opacity: 1; }

        .payment-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 400px; 
            background: var(--bg-color); border-radius: 30px 30px 0 0;
            padding: 30px 20px 40px 20px; z-index: 2001;
            transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1);
            display: flex; flex-direction: column; gap: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.2);
        }
        .payment-sheet.active { transform: translateY(0); }
        
        .payment-header { display: flex; justify-content: space-between; align-items: center; }
        .payment-header h3 { margin: 0; color: var(--brand-black); }
        .close-btn { width: 30px; height: 30px; border-radius: 50%; border: none; color: var(--brand-black); font-weight: bold; cursor: pointer; }
        .amount-input-wrapper { text-align: center; margin: 10px 0; padding: 15px; border-radius: 20px;}
        .amount-input { width: 100%; background: transparent; border: none; outline: none; font-size: 40px; font-weight: bold; color: var(--brand-purple); text-align: center; }
        
        .pay-method { padding: 15px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; border: 2px solid transparent; cursor: pointer;}
        .pay-method.active { border-color: var(--brand-purple); }
        .pay-method-name { font-weight: bold; color: var(--brand-black); font-size: 14px; }
        
        .auto-pay-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 10px; }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;}
        input:checked + .slider { background-color: var(--status-green); }
        input:checked + .slider:before { transform: translateX(22px); }

    </style>
</head>
<body>

    <audio id="successSound" src="success.mp3" preload="auto"></audio>
    <audio id="unlockSound" src="unlock.mp3" preload="auto"></audio>

    <div class="app-container">
        <div class="header">
            <img src="logo.png" alt="СЕВСТАР" class="logo-img" onerror="this.style.display='none'; document.getElementById('altLogo').style.display='block';">
            <h2 id="altLogo" style="display:none; color:var(--brand-purple); margin:0;">СЕВСТАР</h2>
            <div class="avatar"></div>
        </div>

        <div class="main-card neumorphic glow-green">
            <p class="balance-title">Мой счет</p>
            <h2 class="balance-amount" id="balanceText">1250 ₽</h2>
            <div class="status-text" id="statusText">Интернет активен</div>
            <div class="balance-subtext" id="daysLeftText">Хватит на 30 дней</div>
            
            <div class="card-buttons">
                <button class="btn btn-primary" onclick="openPaymentSheet()">Пополнить</button>
                <div class="secondary-buttons">
                    <button class="btn btn-secondary neumorphic" onclick="runDiagnostics(this)">Диагностика</button>
                    <button class="btn btn-secondary neumorphic" onclick="tryHaptic(20)">Чат</button>
                </div>
            </div>
        </div>

        <h3 class="section-title">Умный дом</h3>
        <div class="smart-home-container">
            <div class="sh-card neumorphic">
                <div class="sh-camera" style="background-image: url('intercom.png');"></div>
                <div>
                    <div class="sh-title">Домофон</div>
                    <div class="sh-subtitle">Пр. Острякова 81</div>
                </div>
                <button class="btn-open neumorphic" onclick="openDoor(this, 'Дверь открыта')">Открыть</button>
            </div>
            <div class="sh-card neumorphic">
                <div class="sh-camera" style="background-image: url('parking.png');"></div>
                <div>
                    <div class="sh-title">Парковка</div>
                    <div class="sh-subtitle">Пр. Острякова 81</div>
                </div>
                <button class="btn-open neumorphic" onclick="openDoor(this, 'Доступ разрешен')">Открыть шлагбаум</button>
            </div>
        </div>
    </div>

    <div class="payment-overlay" id="paymentOverlay" onclick="closePaymentSheet()"></div>
    <div class="payment-sheet" id="paymentSheet">
        <div class="payment-header">
            <h3>Пополнение счета</h3>
            <button class="close-btn neumorphic" onclick="closePaymentSheet()">✕</button>
        </div>
        
        <div class="amount-input-wrapper neumorphic-inset">
            <input type="text" class="amount-input" value="500 ₽" readonly>
        </div>

        <div class="pay-method neumorphic active" id="methodSBP" onclick="selectMethod('SBP')">
            <span class="pay-method-name">Система Быстрых Платежей</span>
            <span style="font-size: 20px;">🚀</span>
        </div>
        <div class="pay-method neumorphic" id="methodCard" onclick="selectMethod('Card')">
            <span class="pay-method-name">Карта MIR •••• 4567</span>
            <span style="font-size: 20px;">💳</span>
        </div>

        <div class="auto-pay-row">
            <span class="auto-pay-label">Автопополнение каждый месяц</span>
            <label class="switch">
                <input type="checkbox" onchange="tryHaptic(20)">
                <span class="slider"></span>
            </label>
        </div>

        <button class="btn btn-primary" id="finalPayBtn" style="margin-top: 10px; padding: 20px 0; font-size: 16px;" onclick="processPayment()">Оплатить 500 ₽</button>
    </div>

    <script>
        // Безопасная вибрация
        function tryHaptic(pattern) {
            try { if (navigator && navigator.vibrate) { navigator.vibrate(pattern); } } catch (e) {}
        }

        // Безопасное проигрывание MP3
        function playAudioFile(elementId) {
            try {
                const sound = document.getElementById(elementId);
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(function(error) {
                        console.log("Audio play prevented by browser:", error);
                    });
                }
            } catch(e) {}
        }

        // Логика кнопок
        function openDoor(btn, successMessage) {
            tryHaptic(50);
            const origText = btn.innerText;
            btn.innerText = 'Обработка...';
            btn.style.color = 'var(--brand-yellow)';
            
            setTimeout(() => {
                playAudioFile('unlockSound'); // Попытка проиграть unlock.mp3
                tryHaptic([30, 30]);
                btn.innerText = successMessage;
                btn.style.color = 'var(--status-green)';
                
                setTimeout(() => {
                    btn.innerText = origText;
                    btn.style.color = 'var(--brand-purple)';
                }, 2000);
            }, 800);
        }

        function runDiagnostics(btn) {
            tryHaptic(40);
            const origText = btn.innerText;
            btn.innerText = 'Проверка...';
            btn.style.color = 'var(--brand-yellow)'; 
            
            setTimeout(() => {
                tryHaptic([30, 30]);
                btn.innerText = 'Всё в норме!';
                btn.style.color = 'var(--status-green)';
                
                setTimeout(() => {
                    btn.innerText = origText;
                    btn.style.color = 'var(--brand-purple)';
                }, 2000);
            }, 1500);
        }

        // Логика окна оплаты
        function openPaymentSheet() {
            tryHaptic(20);
            const overlay = document.getElementById('paymentOverlay');
            const sheet = document.getElementById('paymentSheet');
            
            overlay.style.display = 'block';
            setTimeout(() => {
                overlay.classList.add('active');
                sheet.classList.add('active');
            }, 10);
        }

        function closePaymentSheet() {
            tryHaptic(20);
            const overlay = document.getElementById('paymentOverlay');
            const sheet = document.getElementById('paymentSheet');
            
            overlay.classList.remove('active');
            sheet.classList.remove('active');
            
            setTimeout(() => {
                overlay.style.display = 'none';
            }, 400); // Ждем завершения анимации
        }

        function selectMethod(method) {
            tryHaptic(20);
            document.getElementById('methodSBP').classList.remove('active');
            document.getElementById('methodCard').classList.remove('active');
            document.getElementById('method' + method).classList.add('active');
        }

        function processPayment() {
            tryHaptic(40);
            const btn = document.getElementById('finalPayBtn');
            btn.textContent = 'Обработка...';
            btn.style.opacity = '0.7';

            setTimeout(() => {
                tryHaptic([30, 50, 30]);
                playAudioFile('successSound'); // Попытка проиграть success.mp3
                
                btn.textContent = 'Успешно!';
                btn.style.background = 'var(--status-green)';
                btn.style.opacity = '1';

                document.getElementById('balanceText').textContent = '1750 ₽';
                document.getElementById('daysLeftText').textContent = 'Хватит на 55 дней';

                setTimeout(() => {
                    closePaymentSheet();
                    setTimeout(() => {
                        btn.textContent = 'Оплатить 500 ₽';
                        btn.style.background = 'var(--brand-purple)';
                    }, 500);
                }, 1500);
            }, 1200); 
        }
    </script>
</body>
</html>
