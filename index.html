<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Севстар - Умный город</title>
    <style>
        :root {
            /* Фирменные цвета Севстар */
            --brand-purple: rgb(100, 45, 144);
            --brand-yellow: rgb(236, 177, 68);
            --brand-black: rgb(53, 51, 51);
            --brand-white: rgb(255, 255, 255);
            
            --bg-color: #f0f0f3;
            --shadow-light: #ffffff;
            --shadow-dark: #d1d9e6;
            
            --status-green: #4caf50;
            --status-red: #f44336;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            background-color: var(--bg-color);
            position: relative;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            padding-bottom: 100px;
        }

        /* Neumorphism Base */
        .neumorphic {
            background: var(--bg-color);
            box-shadow: 7px 7px 14px var(--shadow-dark), 
                       -7px -7px 14px var(--shadow-light);
            border-radius: 24px;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Эффект для iPhone - вдавливание и уменьшение */
        .neumorphic:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                       inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.96);
        }

        /* Хедер с логотипом */
        .header {
            padding: 25px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo-box {
            height: 40px;
        }
        .logo-box img {
            height: 100%;
            object-fit: contain;
        }

        /* Stories */
        .stories {
            display: flex;
            gap: 15px;
            padding: 10px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .stories::-webkit-scrollbar { display: none; }
        .story-item {
            flex-shrink: 0;
            text-align: center;
        }
        .story-circle {
            width: 66px;
            height: 66px;
            border-radius: 50%;
            border: 2px solid var(--brand-purple);
            padding: 3px;
            margin-bottom: 5px;
        }
        .story-circle div {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        /* Основная карта баланса */
        .balance-card {
            margin: 20px;
            padding: 25px;
            background: var(--bg-color);
            position: relative;
        }
        .balance-card::after {
            content: '';
            position: absolute;
            top: 15px; right: 15px;
            width: 12px; height: 12px;
            background: var(--status-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--status-green);
        }
        .bal-val {
            font-size: 38px;
            font-weight: 800;
            color: var(--brand-purple);
            margin: 5px 0;
        }
        .bal-label { color: var(--brand-black); opacity: 0.6; font-size: 14px; }
        
        .btn-pay {
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: var(--brand-purple);
            color: white;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 4px 4px 10px rgba(100, 45, 144, 0.2);
        }

        /* Умный дом с фото */
        .section-title {
            padding: 0 20px;
            font-size: 20px;
            font-weight: 800;
            color: var(--brand-black);
            margin: 20px 0 10px;
        }
        .horizontal-grid {
            display: flex;
            gap: 15px;
            padding: 10px 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .horizontal-grid::-webkit-scrollbar { display: none; }

        .sh-item {
            min-width: 180px;
            padding: 12px;
        }
        .sh-preview {
            width: 100%;
            height: 110px;
            border-radius: 16px;
            background-color: #333;
            background-size: cover;
            background-position: center;
            margin-bottom: 10px;
            position: relative;
        }
        /* Указываем пути к твоим фото */
        .sh-preview.intercom { background-image: url('intercom.png'); }
        .sh-preview.parking { background-image: url('parking.png'); }
        
        .sh-preview::before {
            content: 'LIVE';
            position: absolute;
            top: 8px; left: 8px;
            background: var(--status-red);
            color: white; font-size: 9px; font-weight: bold;
            padding: 2px 6px; border-radius: 4px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            color: var(--brand-purple);
            font-weight: 700;
            font-size: 14px;
        }

        /* Информер (Погода/Алерт) */
        .informer {
            margin: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .inf-icon { font-size: 32px; }
        .inf-data b { display: block; font-size: 16px; color: var(--brand-black); }
        .inf-data span { font-size: 13px; color: var(--brand-black); opacity: 0.6; }

        /* Навигация */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 414px;
            height: 85px;
            background: var(--bg-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.05);
            border-radius: 30px 30px 0 0;
            z-index: 100;
        }
        .nav-item { text-align: center; color: var(--brand-black); opacity: 0.4; font-size: 10px; font-weight: 700; }
        .nav-item.active { color: var(--brand-purple); opacity: 1; }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 4px; }

    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <div class="logo-box">
                <img src="logo.png" alt="Севстар" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <h2 style="display:none; color:var(--brand-purple); margin:0;">СЕВСТАР</h2>
            </div>
            <div class="neumorphic" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--brand-purple); font-weight: bold;">ЕБ</div>
        </div>

        <div class="stories">
            <div class="story-item">
                <div class="story-circle"><div>🏠</div></div>
                <span>Мой дом</span>
            </div>
            <div class="story-item">
                <div class="story-circle"><div>📶</div></div>
                <span>Wi-Fi</span>
            </div>
            <div class="story-item">
                <div class="story-circle"><div>🎁</div></div>
                <span>Бонусы</span>
            </div>
            <div class="story-item">
                <div class="story-circle"><div>🎥</div></div>
                <span>Око</span>
            </div>
        </div>

        <div class="balance-card neumorphic">
            <span class="bal-label">Лицевой счет: 123456</span>
            <div class="bal-val">1 250 ₽</div>
            <span class="bal-label" style="color: var(--status-green); opacity: 1; font-weight: bold;">Тариф «Ультра» активен</span>
            <button class="btn-pay" onclick="animatePress(this)">ПОПОЛНИТЬ</button>
        </div>

        <div class="section-title">Умный дом</div>
        <div class="horizontal-grid">
            <div class="sh-item neumorphic">
                <div class="sh-preview intercom"></div>
                <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px;">Домофон (Подъезд)</div>
                <button class="btn-action neumorphic" onclick="openAction(this, 'Дверь открыта')">ОТКРЫТЬ</button>
            </div>
            <div class="sh-item neumorphic">
                <div class="sh-preview parking"></div>
                <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px;">Шлагбаум (Двор)</div>
                <button class="btn-action neumorphic" onclick="openAction(this, 'Доступ разрешен')">ПОДНЯТЬ</button>
            </div>
        </div>

        <div class="section-title">Ваш Севастополь</div>
        <div class="informer neumorphic">
            <div class="inf-icon">🌊</div>
            <div class="inf-data">
                <b>Вода в Омеге: +24°C</b>
                <span>Погода в городе: +28°C, ясно</span>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item active"><i>🏠</i>Главная</div>
            <div class="nav-item"><i>🛡️</i>Безопасность</div>
            <div class="nav-item"><i>💳</i>Оплата</div>
            <div class="nav-item"><i>💬</i>Чат</div>
            <div class="nav-item"><i>👤</i>Профиль</div>
        </div>
    </div>

    <script>
        function animatePress(el) {
            // Визуальный отклик уже есть в CSS (:active)
            // Здесь можно добавить звук или доп. логику
        }

        function openAction(el, msg) {
            const originalText = el.innerText;
            el.innerText = 'ЖДУ...';
            el.style.color = 'var(--brand-yellow)';
            
            setTimeout(() => {
                el.innerText = msg;
                el.style.color = 'var(--status-green)';
                setTimeout(() => {
                    el.innerText = originalText;
                    el.style.color = 'var(--brand-purple)';
                }, 2000);
            }, 800);
        }
    </script>
</body>
</html>
